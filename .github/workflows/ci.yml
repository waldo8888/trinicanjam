name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      statuses: write
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel preview
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./

      - name: Run Lighthouse CI
        run: npx lhci autorun --collect.url=${{ steps.deploy.outputs.preview-url }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  csp-check:
    name: CSP Header Check
    runs-on: ubuntu-latest
    needs: [test, lighthouse]
    steps:
      - name: Verify CSP header is present
        run: |
          PREVIEW_URL="${{ needs.lighthouse.outputs.preview-url }}"
          echo "Checking CSP header on: $PREVIEW_URL"
          HEADERS=$(curl -sI "$PREVIEW_URL")
          echo "$HEADERS"
          if echo "$HEADERS" | grep -qi "content-security-policy"; then
            echo "✅ content-security-policy header found"
          else
            echo "❌ content-security-policy header MISSING"
            exit 1
          fi
