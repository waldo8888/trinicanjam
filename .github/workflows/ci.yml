name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx lhci autorun

  csp-check:
    name: CSP Header Check
    runs-on: ubuntu-latest
    needs: [test, lighthouse]
    steps:
      - name: Verify CSP header on production
        run: |
          PROD_URL="https://trinicanjam.vercel.app"
          echo "Checking CSP header on: $PROD_URL"
          for i in $(seq 1 6); do
            HEADERS=$(curl -sI "$PROD_URL" 2>&1)
            if echo "$HEADERS" | grep -qi "content-security-policy"; then
              echo "✅ content-security-policy header found"
              exit 0
            fi
            echo "Attempt $i: not yet visible, waiting 15s..."
            sleep 15
          done
          echo "❌ content-security-policy header MISSING after all retries"
          exit 1
