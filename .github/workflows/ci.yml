name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run

  lighthouse:
    name: Lighthouse CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel production
        run: npx vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait for production deployment
        run: |
          PROD_URL="https://trinicanjam.vercel.app"

          for attempt in $(seq 1 24); do
            STATUS=$(curl -s -o /tmp/trinicanjam-home.html -w "%{http_code}" "$PROD_URL")

            if [ "$STATUS" = "200" ] && grep -q '<div id="root">' /tmp/trinicanjam-home.html; then
              echo "Production URL is responding: $PROD_URL"
              exit 0
            fi

            echo "Waiting for production deployment ($attempt/24)..."
            sleep 10
          done

          echo "Production deployment was not ready in time"
          exit 1

      - name: Run Lighthouse CI
        run: npx lhci autorun --collect.url=https://trinicanjam.vercel.app
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  csp-check:
    name: CSP Header Check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, lighthouse]
    steps:
      - name: Verify CSP header on production
        run: |
          PROD_URL="https://trinicanjam.vercel.app"
          echo "Checking CSP header on: $PROD_URL"
          HEADERS=$(curl -sI "$PROD_URL")
          echo "$HEADERS"
          if echo "$HEADERS" | grep -qi "content-security-policy"; then
            echo "✅ content-security-policy header found"
          else
            echo "❌ content-security-policy header MISSING"
            exit 1
          fi
